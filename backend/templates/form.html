{% extends "base.html" %}
{% block body %}
<h1>登记巡检</h1>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
{% if conflict %}
<div class="warn">
  该灯号今日已有登记记录，本次提交未写入：
  <strong>{{ conflict.aid_code }}</strong>
  的判词为
  <span class="{% if conflict.verdict == '合格' %}ok{% else %}bad{% endif %}">{{ conflict.verdict }} · {{ conflict.note }}</span>。
  去看<a href="{% url 'detail' conflict.pk %}">那条实测</a>。
</div>
{% endif %}
<form class="card" method="post">
  {% csrf_token %}
  <label>航标编号</label>
  <input name="aid_code" />
  <label>实测光强（坎德拉）</label>
  <input name="measured_cd" type="number" step="0.1" />
  <label>要求光强</label>
  <input name="required_cd" type="number" step="0.1" value="1200" />
  <label>方位偏差（度）</label>
  <input name="bearing_error_deg" type="number" step="0.1" value="0" />
  <button type="submit">提交</button>
</form>
{% endblock %}
